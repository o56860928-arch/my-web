<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동유럽 여행</title>
<meta name="theme-color" content="#EAE1D3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="동유럽 여행">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{
  --bg:#EAE1D3; --paper:#FCF8F1; --paper2:#F4ECE0; --ink:#3A2E27; --muted:#857668; --rule:#E3D8C8; --accent:#9A5B4B; --accent-soft:#F1D7CB; --dot:#B8A999;
  --kraft:#E2D1B8; --tape1:rgba(230,186,166,.85); --tape2:rgba(190,204,176,.85); --tape3:rgba(214,193,150,.85);
  --shadow:0 1px 0 rgba(90,60,40,.06),0 18px 34px -26px rgba(90,60,40,.55);
  --c-f:#F5D9CF; --c-f-b:#C66E58; --c-m:#D7E2EE; --c-m-b:#5A7BA3; --c-s:#D8E8D3; --c-s-b:#568D5F; --c-r:#F5E8BF; --c-r-b:#B48A20;
  --h-sha:#F6DDD5; --h-buda:#DDEAD7; --h-wien:#F4E8C7; --h-praha:#DAE4EF;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Gowun Batang","Nanum Myeongjo",AppleMyungjo,"Batang",serif;
  --display:"Playfair Display","Gowun Batang",Georgia,serif;
  --hand:"Nanum Pen Script","Gowun Batang",cursive;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#211B17;--paper:#2C2520;--paper2:#352C26;--ink:#EFE6DA;--muted:#B3A494;--rule:#463B33;--accent:#E3A794;--accent-soft:#5B3C33;--dot:#75665B;--kraft:#4B3E32;--tape1:rgba(170,120,104,.7);--tape2:rgba(120,140,110,.7);--tape3:rgba(150,128,90,.7);--shadow:0 1px 0 rgba(0,0,0,.25),0 18px 34px -24px rgba(0,0,0,.8);--c-f:#5A3A31;--c-f-b:#E49B85;--c-m:#33435A;--c-m-b:#95B3D8;--c-s:#33473A;--c-s-b:#8FC198;--c-r:#544627;--c-r-b:#E2BF60;--h-sha:#4F3631;--h-buda:#35473A;--h-wien:#4E4531;--h-praha:#354356;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#211B17;--paper:#2C2520;--paper2:#352C26;--ink:#EFE6DA;--muted:#B3A494;--rule:#463B33;--accent:#E3A794;--accent-soft:#5B3C33;--dot:#75665B;--kraft:#4B3E32;--tape1:rgba(170,120,104,.7);--tape2:rgba(120,140,110,.7);--tape3:rgba(150,128,90,.7);--shadow:0 1px 0 rgba(0,0,0,.25),0 18px 34px -24px rgba(0,0,0,.8);--c-f:#5A3A31;--c-f-b:#E49B85;--c-m:#33435A;--c-m-b:#95B3D8;--c-s:#33473A;--c-s-b:#8FC198;--c-r:#544627;--c-r-b:#E2BF60;--h-sha:#4F3631;--h-buda:#35473A;--h-wien:#4E4531;--h-praha:#354356;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--ink) 11%,transparent) 1px,transparent 1.3px);background-size:22px 22px;color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.65;letter-spacing:-.005em;-webkit-text-size-adjust:100%;font-feature-settings:"tnum" 1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--dot);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
a.pl{text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent)}
a.pl:hover{color:var(--accent);text-decoration-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3,h4{margin:0;line-height:1.3;letter-spacing:-.02em;font-family:var(--serif);font-weight:700}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}

/* cover */
.hero{padding:36px 12px 30px}
.hero .wrap{padding:0}
.cover{position:relative;background:var(--paper);border-radius:26px;box-shadow:var(--shadow);padding:46px clamp(20px,4.4vw,52px) 40px}
.cover-head{text-align:center;position:relative}
.hand-sm{font-family:var(--hand);font-size:clamp(25px,3vw,31px);line-height:1.1;margin:0}
.title{font-family:var(--display);font-weight:700;font-size:clamp(40px,10.5vw,108px);line-height:.98;letter-spacing:.005em;margin:8px 0 18px}
.route{display:inline-block;font-family:var(--serif);font-weight:700;font-size:clamp(17px,2.3vw,22px);padding:5px 28px 6px;background:var(--accent-soft);border-radius:4px 22px 6px 18px / 14px 6px 18px 8px;transform:rotate(-1deg)}
.cover-sub{font-family:var(--serif);margin:14px 0 0;font-size:clamp(15px,1.8vw,17px)}
.plane{position:absolute;right:-6px;top:-14px;width:min(230px,24vw);color:var(--muted)}
.cover-grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.38fr);gap:34px;margin-top:38px;align-items:start}
.plan-card,.tip-card{position:relative;border-radius:6px;box-shadow:0 1px 0 rgba(90,60,40,.08),0 10px 22px -16px rgba(90,60,40,.5)}
.plan-card{background:var(--paper2);padding:34px 22px 18px;transform:rotate(-.8deg)}
.tape{position:absolute;top:-13px;left:50%;width:104px;height:27px;transform:translateX(-50%) rotate(-4deg);background:var(--tape1);clip-path:polygon(0 0,100% 0,97% 25%,100% 50%,97% 75%,100% 100%,0 100%,3% 75%,0 50%,3% 25%);z-index:2}
.tape.t2{background:var(--tape2)}.tape.t3{background:var(--tape3)}
.card-h{font-family:var(--display);font-size:21px;font-weight:700;text-align:center;letter-spacing:.03em;margin:0 0 12px}
.card-h span{background:linear-gradient(transparent 60%,var(--accent-soft) 60%,var(--accent-soft) 94%,transparent 94%);padding:0 6px}
.dplan{list-style:none;margin:0;padding:0}
.dplan a{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--dot);text-decoration:none}
.dplan li:last-child a{border-bottom:0}
.dplan a:hover b{color:var(--accent)}
.dbadge{font-family:var(--display);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-align:center;background:var(--kraft);border-radius:999px;padding:2px 0}
.dplan b{font-weight:600;font-size:14.5px}
.dplan small{color:var(--muted);font-size:12.5px;margin-left:4px}
.tip-card{background:var(--kraft);padding:34px 22px 16px;transform:rotate(-1.4deg)}
.clip{position:absolute;top:-16px;left:50%;width:46px;transform:translateX(-50%)}
.tip-card .card-h{margin-bottom:8px}
.tip-card .card-h span{background:none;border-top:1.5px solid currentColor;border-bottom:1.5px solid currentColor;padding:0 14px}

/* nav */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:1000;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
nav.tabs .wrap{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;height:52px;align-items:center}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;font-family:var(--serif);font-size:15px;color:var(--muted);white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}

/* sections */
section{padding:40px 0 0}
section.sheet{padding:40px 12px 0}
section.sheet > .wrap{position:relative;background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:46px clamp(18px,4vw,48px) 42px}
section.sheet > .wrap::before{content:"";position:absolute;top:-12px;left:42px;width:112px;height:26px;background:var(--tape1);transform:rotate(-3deg);clip-path:polygon(0 0,100% 0,97% 25%,100% 50%,97% 75%,100% 100%,0 100%,3% 75%,0 50%,3% 25%)}
section.sheet:nth-of-type(3n+1) > .wrap::before{background:var(--tape2);left:auto;right:48px;transform:rotate(3deg)}
section.sheet:nth-of-type(3n+2) > .wrap::before{background:var(--tape3)}
section > .wrap > h2{display:inline-block;font-size:clamp(26px,3.4vw,33px);padding:0 6px;margin-left:-6px;background:linear-gradient(transparent 62%,var(--accent-soft) 62%,var(--accent-soft) 93%,transparent 93%)}
.lede{color:var(--muted);margin:12px 0 26px;max-width:44em}
.note{font-size:13.5px;color:var(--muted)}
.callout{background:var(--c-r);padding:16px 18px;border-radius:4px 14px 6px 12px;margin:22px 0 0;font-size:14.5px;max-width:54em;box-shadow:0 8px 16px -14px rgba(90,60,40,.6)}
h3.mt{font-size:20px;margin:36px 0 12px}
h3.mt small{font-family:var(--font);font-weight:400;font-size:13.5px;color:var(--muted);margin-left:8px;letter-spacing:0}
.ok{display:inline-block;font-family:var(--font);font-size:11.5px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap;line-height:1.5;vertical-align:1px}

/* tickets */
.tix{display:grid;gap:20px}
.tk{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 210px;background:var(--paper2);border-radius:14px}
.tk::before,.tk::after{content:"";position:absolute;right:199px;width:22px;height:22px;border-radius:50%;background:var(--paper)}
.tk::before{top:-11px}.tk::after{bottom:-11px}
.tk-main{padding:20px 24px 18px}
.tk-top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13.5px;color:var(--muted)}
.tk-date{font-family:var(--display);font-weight:700;font-size:19px;
